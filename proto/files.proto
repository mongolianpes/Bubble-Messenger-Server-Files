syntax = "proto3";

package files;

option go_package = ".";

message DelFileRequest {
  string storage_path = 1;
}

message DelFileResponse {}

message GenerateTempPathReqeust {
  string info = 1;
}

message GenerateTempPathResponse {
  string temp_path = 1;
}

service FilesService {
  rpc Del(DelFileRequest) returns (DelFileResponse);
  rpc GenerateTempPath(GenerateTempPathReqeust) returns (GenerateTempPathResponse);
}
