syntax = "proto3";

package files;

option go_package = ".";

message DelFileRequest {
  string storage_path = 1;
}

message DelFileResponse {}

message TempPathReqeust {
  string info = 1;
}

message TempPathResponse {
  string temp_path = 1;
  string storage_path = 2;
}

service FilesService {
  rpc Del(DelFileRequest) returns (DelFileResponse);
  rpc TempPath(TempPathReqeust) returns (stream TempPathResponse);
}
